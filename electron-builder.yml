appId: com.nexus.launcher
productName: Nexus Launcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # better-sqlite3: chỉ cần file native đã biên dịch sẵn cho Windows x64,
  # bỏ mã nguồn SQLite (~10 MB) và bản cho hệ điều hành khác
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/!(win32-x64).node'
asarUnpack:
  - resources/**
  # Module native (better-sqlite3, koffi) phải nằm ngoài asar mới nạp được
  - '**/*.node'
# Chỉ giữ ngôn ngữ giao diện Chromium mà app dùng (bỏ ~50 MB của 53 ngôn ngữ khác)
electronLanguages:
  - vi
  - en-US
win:
  executableName: Nexus Launcher
nsis:
  artifactName: nexus-launcher-${version}-setup.${ext}
  # Trình cài có các bước như bình thường, cho chọn thư mục / ổ đĩa để cài.
  # Mặc định: %LOCALAPPDATA%\Programs\Nexus Launcher (cài cho tài khoản đang dùng, không cần quyền admin;
  # chọn thư mục cần quyền admin như Program Files thì trình cài tự xin quyền)
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# Module native đều có bản biên dịch sẵn => không cần Python / Visual Studio để build
npmRebuild: false
# Cập nhật tự động (electron-updater): bản cài đọc latest.yml trên GitHub Releases của repo này.
# Phát hành: tạo Release trên GitHub, đính kèm file setup .exe, .exe.blockmap và latest.yml trong dist/
publish:
  provider: github
  owner: hienbn1910
  repo: NexusGameLauncher
  releaseType: release
